# Push a tag like v0.4.0 → builds wp-mcp-tools-0.4.0.zip (git archive, honours .gitattributes export-ignore)
# and attaches it to a GitHub release. Run manually to just get the zip as a build artifact.
name: Release zip

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  zip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build zip
        id: zip
        run: |
          VERSION=$(grep -oP "define\( 'WPMCP_VERSION', '\K[^']+" wp-mcp-tools.php)
          git archive --format=zip --prefix=wp-mcp-tools/ -o "wp-mcp-tools-$VERSION.zip" HEAD
          echo "file=wp-mcp-tools-$VERSION.zip" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.zip.outputs.file }}
          path: ${{ steps.zip.outputs.file }}
      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: ${{ steps.zip.outputs.file }}
